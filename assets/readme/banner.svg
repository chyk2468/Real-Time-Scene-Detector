<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Real-time Scene Vision Banner</title>
  <desc id="svg-desc">Ultralytics scene/object view from webcam or images</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E08"/>
      <stop offset="100%" stop-color="#1C1710"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1710"/>
      <stop offset="100%" stop-color="#120E08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" stroke="#2E2419" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <rect x="48" y="38" width="164" height="24" rx="12" fill="#2E2419" opacity="0.6"/>
  <text x="130" y="54" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MACHINE LEARNING</text>
  <text x="48" y="112" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">AI Real-time Scene Vision</text>
  <text x="48" y="150" fill="#D97706" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Ultralytics scene/object view from webcam or images</text>
  <rect x="48" y="194" width="82" height="32" rx="16" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
  <text x="89" y="215" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Python</text>
  <rect x="140" y="194" width="109" height="32" rx="16" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
  <text x="194" y="215" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">streamlit</text>
  <rect x="259" y="194" width="127" height="32" rx="16" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
  <text x="322" y="215" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">ultralytics</text>
  <rect x="396" y="194" width="145" height="32" rx="16" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
  <text x="468" y="215" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">opencv-python</text>
  <rect x="551" y="194" width="154" height="32" rx="16" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
  <text x="628" y="215" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Computer visio</text>
</svg>
