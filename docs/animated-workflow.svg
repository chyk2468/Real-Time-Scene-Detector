<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><rect width="1200" height="390" rx="18" fill="#0D1220"/><text x="56" y="42" fill="#60A5FA" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="26" font-weight="700">Real-Time Scene Vision</text><text x="56" y="108" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="14">Detect objects in camera frames or images and estimate the scene category.</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#263248"/><path d="M 288 236 H 334" stroke="#A7B3C5" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" stroke="#A7B3C5" fill="none"/><path d="M 576 236 H 622" stroke="#A7B3C5" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" stroke="#A7B3C5" fill="none"/><path d="M 864 236 H 910" stroke="#A7B3C5" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" stroke="#A7B3C5" fill="none"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#151E30" stroke="#263248"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#60A5FA"/><text x="72" y="184" fill="#60A5FA" font-family="Arial,sans-serif" font-size="10" font-weight="700">SOURCE</text><text x="72" y="219" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="15" font-weight="700">Camera or image</text><text x="72" y="248" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="11.5">Choose a live feed or uploaded image.</text><circle cx="260" cy="179" r="4" fill="#60A5FA"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#151E30" stroke="#263248"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#A78BFA"/><text x="360" y="184" fill="#A78BFA" font-family="Arial,sans-serif" font-size="10" font-weight="700">PREPROCESS</text><text x="360" y="219" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="15" font-weight="700">OpenCV + Pillow</text><text x="360" y="248" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="11.5">Prepare frames for inference.</text><circle cx="548" cy="179" r="4" fill="#A78BFA"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#151E30" stroke="#263248"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#F472B6"/><text x="648" y="184" fill="#F472B6" font-family="Arial,sans-serif" font-size="10" font-weight="700">DETECTION</text><text x="648" y="219" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="15" font-weight="700">YOLO model</text><text x="648" y="248" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="11.5">Find objects above the threshold.</text><circle cx="836" cy="179" r="4" fill="#F472B6"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#151E30" stroke="#263248"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#60A5FA"/><text x="936" y="184" fill="#60A5FA" font-family="Arial,sans-serif" font-size="10" font-weight="700">SCENE</text><text x="936" y="219" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="15" font-weight="700">Summarise labels</text><text x="936" y="248" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="11.5">Estimate scene context and show results.</text><circle cx="1124" cy="179" r="4" fill="#60A5FA"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#A78BFA"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#F472B6"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#A7B3C5" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. Open architecture.html for interactive stage details.</text></svg>