<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Real-Time Scene Vision workflow</title><desc id="desc">A Streamlit interface passes webcam frames or uploaded images through YOLO object detection, then uses detected objects to estimate a scene category.</desc><rect width="1200" height="400" rx="18" fill="#0D1220"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#60A5FA">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#F1F5F9">Real-Time Scene Vision</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A7B3C5">Camera or image to detected objects and scene label</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#263248"/><path d="M 300 237 L 330 237" stroke="#A7B3C5" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#A7B3C5" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#A7B3C5" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#A7B3C5" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#A7B3C5" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#A7B3C5" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#151E30" stroke="#263248" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#60A5FA"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#60A5FA">01 / SOURCE</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">Webcam or image</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B3C5">Choose live stream or upload mode.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#151E30" stroke="#263248" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#A78BFA"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#A78BFA">02 / VISION</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">OpenCV preprocessing</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B3C5">Prepare frames or uploaded pixels.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#151E30" stroke="#263248" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#F472B6"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#F472B6">03 / DETECTION</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">YOLO model</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B3C5">Find objects above the threshold.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#151E30" stroke="#263248" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#60A5FA"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#60A5FA">04 / SCENE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">Heuristic + display</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B3C5">Summarise objects and infer context.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#60A5FA">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B3C5">Scene labels are heuristic estimates derived from detected objects, not guaranteed scene recognition.</text></svg>